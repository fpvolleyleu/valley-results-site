<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>集計結果</title>
  <style>
    body{font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;margin:16px;}
    pre{background:#111;color:#eee;padding:12px;border-radius:10px;overflow:auto;max-height:70vh;}
    .meta{margin:0 0 10px;color:#555;font-size:12px;}
  </style>
</head>
<body>
  <h1>集計結果</h1>
  <p class="meta" id="meta">loading...</p>
  <pre id="out">loading...</pre>

  <script>
    (async () => {
      // cache: "no-store" で最新を取りに行く（CDNキャッシュ対策）
      const res = await fetch("./results.json", { cache: "no-store" });
      const text = await res.text();
      document.getElementById("out").textContent = text;

      try{
        const j = JSON.parse(text);
        const upd = j.updatedAt ?? j.updated_at ?? j.updated ?? null;
        document.getElementById("meta").textContent =
          upd ? `更新: ${upd}` : "更新日時: (results.json内に updatedAt を入れると表示されます)";
      }catch{
        document.getElementById("meta").textContent = "JSONとして解釈できませんでした（results.jsonを確認）";
      }
    })();
  </script>
</body>
</html>
